<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Public Land Voting Tool (demo)</title>
<meta name="description" content="Demo: one shared record of what the CDC, the councilperson, the City's neighborhood staff and residents want for each of Cleveland's land bank lots.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='11' height='11' fill='%2300875F'/%3E%3Crect x='17' y='4' width='11' height='11' fill='%230068A6'/%3E%3Crect x='4' y='17' width='11' height='11' fill='%23E6A200'/%3E%3Crect x='17' y='17' width='11' height='11' fill='%23C9C7C2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://services3.arcgis.com" crossorigin>
<style>
:root{
  --ink:#1D1A26; --muted:#67646C; --line:#DCDAD6; --mist:#F3F2F0; --paper:#FFFFFF;
  --danger:#9E2F2A;
  --font:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card:16px; --r-ctl:11px;
  --shadow:0 1px 2px rgba(29,26,38,.07), 0 10px 30px rgba(29,26,38,.11);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--mist);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none;background:var(--c)}
.sw.h{background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 5px)!important;box-shadow:inset 0 0 0 1.5px var(--c)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:44px;padding:0 16px;border-radius:var(--r-ctl);
  border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:15px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:#bbb8b2}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-dark:hover{border-color:var(--ink)}
.btn-sm{min-height:38px;font-size:14px;padding:0 12px}
.btn-warn{border-color:var(--danger);color:var(--danger)}

/* ---------- the map ---------- */
#map{position:fixed;inset:0;background:#fff}
.maplibregl-ctrl-attrib{font-size:10.5px}
.dock{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px);
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.dock>*{pointer-events:auto;width:100%;max-width:440px}

/* the tray: who's voting, then the three choices */
.vbar{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:7px}
.sq{flex:1 1 0;min-width:0;height:52px;border:0;border-radius:12px;background:var(--c);color:#fff;font-size:13.5px;font-weight:650;line-height:1.1;
  display:grid;place-items:center;padding:0 4px;text-align:center;position:relative;text-shadow:0 1px 1px rgba(0,0,0,.2);
  opacity:.4;filter:saturate(.75);transition:opacity .18s,filter .18s,transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.vbar.lit .sq{opacity:1;filter:none}
.vbar.lit .sq:active{transform:scale(.95)}
.vbar.lit .sq.cur{box-shadow:0 0 0 2.5px var(--paper),0 0 0 5px var(--ink);transform:translateY(-1px)}
.sq.cur::after{content:"";position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:#fff}
.whob{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--mist);border-radius:11px;min-height:40px;padding:0 10px 0 12px;
  font-size:14px;text-align:left;color:var(--muted)}
.whob b{color:var(--ink);font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whob svg{width:18px;height:18px;flex:none;color:var(--ink)}
.whob:hover{background:#ebe9e5}
.whob.unset b{font-weight:600}
.tray{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:7px;display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.tray .vbar{box-shadow:none;padding:0;border-radius:0}
@media (max-width:420px){.sq{font-size:12.5px;padding:0 2px}}

/* the open lot: a strip above the tray on phones, a panel on wide screens */
.card{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:11px 12px 12px 14px;
  max-height:min(56dvh, calc(100dvh - 240px));overflow:auto;overscroll-behavior:contain}
.card.in{animation:cardIn .2s ease-out}
@keyframes cardIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.ch{display:flex;align-items:flex-start;gap:10px}
.ct{flex:1;min-width:0}
.ct b{display:block;font-size:16.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct .pin{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nx{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:var(--mist);display:grid;place-items:center;color:var(--ink)}
.nx:hover{background:#e8e6e2}
.nx svg{width:20px;height:20px}
.lead{margin-top:10px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lead b{font-weight:650}
.lead .sw{width:13px;height:13px}
.lead.none{color:#8d8992;font-size:14px}
/* everyone's votes on the lot as one bar, a segment per vote */
.stack{display:flex;gap:2px;height:8px;margin-top:8px}
.stack i{flex:1;background:var(--c);border-radius:2px}
.sec{margin-top:12px;padding-top:9px;border-top:1px solid var(--mist)}
.sec h3{margin:0 0 5px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.sec h3 span{font-weight:500;font-variant-numeric:tabular-nums}
.who{list-style:none;margin:0 -6px;padding:0;display:grid;gap:1px}
.who li{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:4px 6px;border-radius:8px}
.who li.me{background:var(--mist)}
.who .pick{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.who .pick.none{color:#a19da6;font-weight:400}
.res{display:flex;flex-wrap:wrap;gap:5px}
.rc{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:3px 9px 3px 7px;border-radius:999px;background:var(--mist)}
.rc.me{box-shadow:inset 0 0 0 1.5px var(--ink)}
.rc .sw{border-radius:50%;width:10px;height:10px}
.rsum{font-size:12.5px;color:var(--muted);margin-top:6px}
.empty{font-size:13.5px;color:#a19da6}
.cx{border-top:1px solid var(--mist);margin-top:11px;padding-top:7px;font-size:13.5px}
.cx summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);padding:3px 0}
dl.city{display:grid;grid-template-columns:minmax(110px,42%) 1fr;gap:4px 10px;margin:6px 0 0;font-size:13px}
dl.city dt{color:var(--muted)}
dl.city dd{margin:0;word-break:break-word}
dl.city dd.blank{color:#a19da6;font-style:italic}
@media (min-width:900px){
  .card{position:fixed;left:20px;top:76px;width:376px;max-height:calc(100dvh - 96px)}
  .card.in{animation-name:cardInSide}
  .maplibregl-ctrl-top-left{top:auto;bottom:0}
}
@keyframes cardInSide{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}

/* who's voting */
.sheet{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);padding:14px;font-size:14.5px;
  max-height:calc(100dvh - 120px);overflow:auto;animation:cardIn .16s ease-out}
.sheet .wh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet .wh p{margin:2px 0 0;line-height:1.35}
.sheet .wh b{font-size:16.5px}
.sheet h4{margin:0 0 6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.role{min-height:48px;border:1.5px solid var(--line);background:var(--paper);border-radius:var(--r-ctl);padding:6px 10px;text-align:left;font-size:14px;font-weight:600;line-height:1.2}
.role:hover{border-color:#bbb8b2}
.role[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.rform{margin-top:14px}
.rrow{display:flex;gap:6px;align-items:center}
.rrow input{flex:1;min-width:0;min-height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-size:15px;background:var(--paper)}
.rrow input:focus{outline:none;border-color:var(--ink)}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;min-height:34px;padding:0 12px;font-size:13.5px;font-weight:550}
.chip:hover{border-color:#bbb8b2}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.msg{font-size:12.5px;color:var(--danger);margin-top:6px}
.msg:empty{display:none}

/* the top bar */
.tbar{position:fixed;z-index:20;left:0;right:0;top:0;padding-top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:1px solid #E4E2DD}
.tbar .row{height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 0 16px}
.tname{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tname span{font-weight:500;color:var(--muted);margin-left:6px}
.tb{flex:none;height:44px;border:0;border-radius:11px;background:transparent;display:inline-flex;align-items:center;gap:7px;padding:0 10px;color:var(--ink);font-size:14.5px;font-weight:600}
.tb:hover{background:var(--mist)}
.tb[aria-expanded="true"]{background:var(--ink);color:#fff}
.tb svg{width:22px;height:22px}
@media (max-width:520px){.tb .tl{display:none}.tname span{display:none}}

.zhint{position:fixed;z-index:11;left:50%;bottom:calc(var(--dock-h,140px) + 14px);transform:translate(-50%,6px);background:rgba(29,26,38,.86);color:#fff;
  border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.zhint.show{opacity:1;transform:translate(-50%,0)}
.toast{position:fixed;z-index:800;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;max-width:min(420px,calc(100% - 24px));width:max-content;
  background:var(--danger);color:#fff;border-radius:12px;padding:11px 16px;font-size:14.5px;line-height:1.3;box-shadow:0 8px 24px rgba(29,26,38,.25);
  transition:opacity .18s,transform .18s;top:calc(env(safe-area-inset-top,0px) + 68px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* How this works: a card under the bar, the map still showing around it */
.page{position:fixed;z-index:22;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 64px);
  max-height:calc(100dvh - env(safe-area-inset-top,0px) - 64px - var(--dock-h,140px) - 22px);overflow:auto;overscroll-behavior:contain;
  background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);animation:popIn .16s ease-out;padding:0 18px 18px}
@keyframes popIn{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.page .top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:1;background:var(--paper);padding:14px 0 8px}
.page h1{font-size:19px;letter-spacing:-.01em;margin:0;line-height:1.25}
.page h2{font-size:15px;margin:18px 0 6px}
.page p{margin:0 0 10px;font-size:14.5px;line-height:1.5}
.page .nx{width:36px;height:36px;border-radius:10px}
/* before and after, in the diagram's terms */
.paths{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:4px 0 12px;font-size:13.5px;align-items:baseline}
.paths dt{font-weight:650;color:#3D348B}
.paths dd{margin:0;color:var(--muted)}
.key{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:14px}
.key li{display:flex;align-items:center;gap:10px}
.key .sws{display:flex;gap:3px}
.key .sw{width:14px;height:14px}
.page .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.page .small{font-size:13px;color:var(--muted)}
@media (min-width:900px){.page{left:auto;right:12px;width:420px;max-height:calc(100dvh - 76px)}}
.boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);z-index:60;background:var(--mist)}
.boot b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Map of the city's land bank lots"></div>
<header class="tbar" data-tbar hidden>
  <div class="row">
    <div class="tname">Public Land Voting Tool<span>Demo</span></div>
    <button class="tb" data-about aria-expanded="false" aria-label="How this works"><span data-icon="about"></span><span class="tl">How this works</span></button>
  </div>
</header>
<div class="zhint" data-zhint role="status"></div>
<div class="dock" data-dock hidden>
  <section class="card" data-card hidden aria-label="Selected lot"></section>
  <div class="sheet" data-sheet hidden role="dialog" aria-label="Who's voting"></div>
  <div class="tray">
    <button class="whob" data-who></button>
    <nav class="vbar" data-bar aria-label="Vote"></nav>
  </div>
</div>
<section class="page" data-page role="dialog" aria-label="How this works" hidden></section>
<div class="boot" data-boot><div><b>Public Land Voting Tool</b><span data-boot-msg>Loading the city's lots…</span></div></div>
<div class="toast" id="toast" role="alert" aria-live="assertive"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";
/* =====================================================================
   Public Land Voting Tool: stakeholder demo

   One map of the City of Cleveland's land bank lots, loaded live from the
   city's layer. Tap a lot to see the city's record for it and what each
   stakeholder wants: the CDC, the councilperson, the neighborhood planner,
   the neighborhood investment manager (one seat each), and residents (by
   name). Anyone can switch who's voting and pick open space, development
   or yard expansion. Tap your current choice again to take it back.

   Each person counts once. On the map, a lot's color is the leading use:
   solid when everyone who weighed in agrees, hatched when they don't, grey
   when tied. Votes are kept in this browser only (localStorage); nothing
   is sent anywhere. For demonstration only.
   ===================================================================== */
const CONFIG = {
  parcelsUrl: "https://services3.arcgis.com/dty2kHktVXHrqO8i/arcgis/rest/services/City_Landbank/FeatureServer/0",
  idField: "parcelpin", addressField: "par_addr_all",
  imagery: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  imageryAttribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics",
  imageryOpacity: 0.5,
  labels: "https://tiles.openfreemap.org/styles/positron",
  selectZoom: 15
};
const CHOICES = [
  { key: "open_space", label: "Open space", color: "#00875F" },
  { key: "development", label: "Development", color: "#0068A6" },
  { key: "yard_expansion", label: "Yard expansion", color: "#E6A200" }
];
const TIE = { key: "tie", label: "Tied", color: "#8A8781" };
const CK = Object.fromEntries([...CHOICES, TIE].map(c => [c.key, c]));
const lower = k => CK[k].label.toLowerCase();
// The set seats: one vote each per lot. Residents vote by name.
const ROLES = [
  { key: "cdc", label: "CDC" },
  { key: "council", label: "Councilperson" },
  { key: "planner", label: "Neighborhood planner" },
  { key: "nim", label: "Neighborhood investment manager" }
];
const RK = Object.fromEntries(ROLES.map(r => [r.key, r]));

/* ---------------------------------------------------------------- helpers */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => new Intl.NumberFormat().format(n);
const normId = v => String(v ?? "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
const displayId = id => /^\d{8}$/.test(id) ? `${id.slice(0, 3)}-${id.slice(3, 5)}-${id.slice(5)}` : id;
const cleanName = v => String(v ?? "").replace(/\s+/g, " ").trim().slice(0, 40);
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};
const isWide = () => matchMedia("(min-width: 900px)").matches;
const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let toastTimer = 0;
function toast(text, ms = 4500) {
  const el = $("#toast"); el.textContent = text;
  el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), ms);
}
let pillTimer = 0;
function pill(text, ms = 1800) {
  const el = $("[data-zhint]"); el.textContent = text; el.classList.add("show");
  clearTimeout(pillTimer); pillTimer = setTimeout(() => el.classList.remove("show"), ms);
}
const ICON = {
  about: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><path d="M12 7.6v.2"/></svg>`,
  close: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
  person: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.7 3.6-5.8 7-5.8s6.2 2.1 7 5.8"/></svg>`,
  down: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`
};

/* ------------------------------------------------- the record (this browser)
   votes: parcel -> voter -> { role, name, choice, at }. A voter is a seat ("cdc") or a resident ("r:dana r."). */
const STORE_KEY = "plvt-demo:v1";
let D = { votes: {}, me: null, names: [], seen: false };
function validMe(m) {
  if (!m || typeof m !== "object") return null;
  if (RK[m.role]) return { role: m.role };
  if (m.role === "resident" && cleanName(m.name)) return { role: "resident", name: cleanName(m.name) };
  return null;
}
function loadStore() {
  const d = ls.get(STORE_KEY) || {};
  const votes = {};
  for (const [pid, lot] of Object.entries(d.votes && typeof d.votes === "object" ? d.votes : {})) {
    for (const [k, v] of Object.entries(lot || {})) if (v && CK[v.choice] && v.choice !== "tie") (votes[pid] ||= {})[k] = v;
  }
  D = { votes, me: validMe(d.me), names: Array.isArray(d.names) ? d.names.map(cleanName).filter(Boolean).slice(0, 8) : [], seen: !!d.seen };
}
function saveStore() {
  if (!ls.set(STORE_KEY, D)) toast("This browser isn't saving. Votes will be gone when the page closes.");
}
const voterKey = m => m.role === "resident" ? `r:${m.name.toLowerCase()}` : m.role;
const meLabel = m => m.role === "resident" ? m.name : RK[m.role].label;
const myChoice = id => D.me && id ? D.votes[id]?.[voterKey(D.me)]?.choice ?? null : null;
const entries = id => Object.entries(D.votes[id] || {}).map(([k, v]) => ({ k, ...v }));
// Each person counts once. Lead: the choice with the most votes, "tie" when two share the top.
function summary(id) {
  const es = entries(id), counts = Object.fromEntries(CHOICES.map(c => [c.key, 0]));
  for (const e of es) counts[e.choice]++;
  const total = es.length, max = Math.max(...Object.values(counts));
  const top = CHOICES.filter(c => max > 0 && counts[c.key] === max);
  return { es, counts, total, max, lead: !total ? null : top.length > 1 ? "tie" : top[0].key, agree: total > 0 && max === total };
}
// The lot on the map: solid when everyone agrees, hatched when they don't (grey when tied).
function lookOf(id) {
  const s = summary(id); if (!s.total) return null;
  return { st: s.agree ? "s" : "h", c: s.lead };
}

/* ------------------------------------------------------- the city's lots */
const PARCEL_FORMAT = 1;
const idb = {

function buildParcels(raw, oid) {

    const g = f.geometry; if (!g || (g.type !== "Polygon" && g.type !== "MultiPolygon")) continue;

    seen.add(id);

  }

  for (const it of items) if (it.addr?.full) { const k = gk(it.f.properties.cx, it.f.properties.cy); grid.has(k) ? grid.get(k).push(it) : grid.set(k, [it]); }

}
function titleCase(s) {

    /^\d+(st|nd|rd|th)$/.test(w) ? w : /^\d/.test(w) || /^(n|s|e|w|ne|nw|se|sw)$/.test(w) ? w.toUpperCase()
    : w.replace(/(^|['-])([a-z])/g, (_, x, y) => x + y.toUpperCase()).replace(/^Mc([a-z])/, (_, y) => "Mc" + y.toUpperCase())).join(" ");
}

  const m = s.match(/^(\d+[A-Za-z]?(?:-\d+[A-Za-z]?)?)\s+(.+)$/);
  if (m) return /^0+$/.test(m[1]) ? { street: titleCase(m[2]) } : { full: titleCase(`${m[1]} ${m[2]}`), street: titleCase(m[2]) };

function hatchImage(color) {

let paintKey = "";
function paint() {
  if (!gl || !gl.getSource("voted")) return;

    const f = S.byId.get(id), look = lookOf(id); if (!f || !look) continue;

  }

/* ---------------------------------------------------------------- voting */
function vote(choice) {
  if (!S.sel) return pill("Pick a lot first");
  if (!D.me) return openWho(choice);   // ask who's voting, then cast
  const k = voterKey(D.me), lot = D.votes[S.sel] ||= {};
  if (lot[k]?.choice === choice) delete lot[k];   // the same choice again takes it back
  else lot[k] = { role: D.me.role, name: D.me.role === "resident" ? D.me.name : null, choice, at: Date.now() };
  if (!Object.keys(lot).length) delete D.votes[S.sel];

}
function setMe(me) {
  D.me = me;
  if (me.role === "resident") D.names = [me.name, ...D.names.filter(n => n.toLowerCase() !== me.name.toLowerCase())].slice(0, 8);
  saveStore();
  const pending = S.pending; closeSheet();
  drawWho(); drawBar(); drawCard();

  if (S.sheet) closeSheet();
  S.page = "about"; clearArmed = false;
  const lots = Object.keys(D.votes).length, votes = Object.values(D.votes).reduce((n, l) => n + Object.keys(l).length, 0);
  const sw = (k, h) => `<i class="sw${h ? " h" : ""}" style="--c:${CK[k].color}"></i>`;
  const el = $("[data-page]");
  el.innerHTML = `<div class="top"><h1>One record for every lot</h1><button class="nx" data-close-page aria-label="Close">${ICON.close}</button></div>
    <p>What should happen to a city-owned vacant lot? Today, each group answers in its own place, and the answers rarely meet.</p>
    <dl class="paths">
      <dt>City</dt><dd>Citywide planning frameworks, on the Open Data Portal</dd>
      <dt>Council</dt><dd>Ward meetings, emails and phone calls, in notes and spreadsheets</dd>
      <dt>CDCs</dt><dd>Neighborhood plans, on a CDC website</dd>
      <dt>Residents</dt><dd>Block club meetings, in conversations and meeting notes</dd>
    </dl>
    <p>This puts every answer in one place, keyed to the parcel and open to everyone. The meetings still happen. What's decided in them lands here, next to the City's own record for the lot.</p>
    <h2>Voting</h2>
    <p>Tap a lot, choose who's voting, then pick open space, development or yard expansion. Tap your choice again to take it back. The CDC, the councilperson, the neighborhood planner and the neighborhood investment manager each have one vote per lot. Residents vote by name. Everyone counts once.</p>
    <h2>On the map</h2>
    <ul class="key">
      <li><span class="sws">${CHOICES.map(c => sw(c.key)).join("")}</span>Everyone who weighed in agrees</li>
      <li><span class="sws">${CHOICES.map(c => sw(c.key, true)).join("")}</span>Not everyone agrees; the color is the leading use</li>
      <li><span class="sws">${sw("tie", true)}</span>Tied for the lead</li>
    </ul>
    <h2>This demo</h2>
    <p>Votes are saved in this browser only. Nothing is sent anywhere. The lots and their city records come live from the City's land bank layer.</p>
    <div class="acts"><button class="btn btn-sm${votes ? " btn-warn" : ""}" data-clear ${votes ? "" : "disabled"}>Clear all votes</button>
      <span class="small">${votes ? `${fmt(votes)} vote${votes === 1 ? "" : "s"} on ${fmt(lots)} lot${lots === 1 ? "" : "s"}` : "No votes yet"}</span></div>`;
  el.hidden = false; el.scrollTop = 0;
  $("[data-about]").setAttribute("aria-expanded", "true");
  if (!D.seen) { D.seen = true; saveStore(); }
  drawCard();
}
function closePage() {
  S.page = null; const el = $("[data-page]"); el.hidden = true; el.innerHTML = "";
  $("[data-about]").setAttribute("aria-expanded", "false");
  drawCard();
}
function clearAll(btn) {
  if (!clearArmed) { clearArmed = true; btn.textContent = "Tap again to clear"; return; }
  D.votes = {}; saveStore(); paint(); drawBar(); openAbout(); pill("All votes cleared");
}

/* ---------------------------------------------------------------- wiring */
function wire() {
  document.addEventListener("click", e => {
    if (e.isTrusted && S.page && !e.target.closest?.("[data-page], [data-tbar]")) closePage();   // a tap elsewhere folds it away
    const t = e.target.closest("button"); if (!t) return;
    if (t.matches("[data-choice]")) return vote(t.dataset.choice);
    if (t.matches("[data-close]")) return select(null);
    if (t.matches("[data-who]")) return S.sheet === "who" ? closeSheet() : openWho();
    if (t.matches("[data-close-sheet]")) return closeSheet();
    if (t.matches("[data-role]")) return setMe({ role: t.dataset.role });
    if (t.matches("[data-res]")) return setMe({ role: "resident", name: t.dataset.res });
    if (t.matches("[data-about]")) return S.page ? closePage() : openAbout();
    if (t.matches("[data-close-page]")) return closePage();
    if (t.matches("[data-clear]")) return clearAll(t);
  });
  document.addEventListener("submit", e => {
    e.preventDefault();
    if (!e.target.matches("[data-res-form]")) return;
    const name = cleanName(e.target.elements.n.value);
    if (!name) { $("[data-res-msg]").textContent = "Type a name to vote as a resident."; return e.target.elements.n.focus(); }
    setMe({ role: "resident", name });
  });
  document.addEventListener("keydown", e => {
    if (e.target.matches("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) { if (e.key === "Escape" && S.sheet) closeSheet(); return; }
    if (e.key === "Escape") { if (S.page) return closePage(); if (S.sheet) return closeSheet(); if (S.sel) return select(null); }
    if (!S.page && !S.sheet && /^[1-3]$/.test(e.key) && S.sel) vote(CHOICES[+e.key - 1].key);
  });
  // another tab of this demo changed the votes
  addEventListener("storage", e => { if (e.key === STORE_KEY) { loadStore(); paint(); drawBar(); drawWho(); drawCard(); } });
  addEventListener("resize", setDockH);
}

async function boot() {
  loadStore();
  wire();
  let fc;
  try { fc = await loadParcels(); }
  catch (e) { $("[data-boot-msg]").textContent = `The city's lot list didn't load (${e.message}). Reload the page to try again.`; return; }
  S.fc = fc; S.fields = fc.metadata.fields;
  let x0 = 180, y0 = 90, x1 = -180, y1 = -90;
  for (const f of fc.features) { const p = f.properties; S.byId.set(p.id, f); x0 = Math.min(x0, p.cx); y0 = Math.min(y0, p.cy); x1 = Math.max(x1, p.cx); y1 = Math.max(y1, p.cy); }
  S.bounds = [[x0, y0], [x1, y1]];
  await initMap();
  $$("[data-icon]").forEach(b => { b.innerHTML = ICON[b.dataset.icon]; });
  $("[data-boot]").hidden = true; $("[data-dock]").hidden = false; $("[data-tbar]").hidden = false;
  drawBar(); drawWho(); paint();
  if (!D.seen) openAbout();
}
boot();
</script>
</body>
</html>
